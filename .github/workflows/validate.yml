name: Validate and build Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NIGHTBREW_TEST_BROWSER: /usr/bin/google-chrome
      NIGHTBREW_CHROMIUM: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run desktop:install
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r backend/requirements.lock.txt
      - run: .venv/bin/python -m pytest backend/tests -q
      - run: npm run build
      - run: npm run test:desktop
      - run: npm run test:e2e
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run desktop:install
      - name: Create Python environment
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -r backend/requirements-build.txt
      - name: Test backend and Windows UI Automation
        run: |
          $env:NIGHTBREW_TEST_BROWSER = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          .venv\Scripts\python -m pytest backend/tests -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test managed desktop backend
        run: npm run test:desktop
      - name: Validate Electron IPC and automatic startup
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build unsigned development installer
        run: |
          .venv\Scripts\Activate.ps1
          npm run package:win:unsigned
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate packaged backend and silent installation
        run: |
          $unpacked = Start-Process "release\win-unpacked\NightBrew AI Employee.exe" -ArgumentList '--smoke-test' -PassThru
          if (-not $unpacked.WaitForExit(60000)) { Stop-Process -Id $unpacked.Id; throw 'Packaged startup timeout' }
          if ($unpacked.ExitCode -ne 0) { throw 'Packaged startup failed' }
          $installer = Get-ChildItem release\NightBrew-DEV-UNSIGNED-*.exe | Select-Object -First 1
          if (-not $installer) { throw 'No installer produced' }
          $destination = "$env:RUNNER_TEMP\NightBrewInstalled"
          $installation = Start-Process $installer.FullName -ArgumentList "/S /D=$destination" -Wait -PassThru
          if ($installation.ExitCode -ne 0) { throw 'Silent installation failed' }
          $installed = Start-Process "$destination\NightBrew AI Employee.exe" -ArgumentList '--smoke-test' -PassThru
          if (-not $installed.WaitForExit(60000)) { Stop-Process -Id $installed.Id; throw 'Installed startup timeout' }
          if ($installed.ExitCode -ne 0) { throw 'Installed startup failed' }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: NightBrew-Windows-DEV-UNSIGNED
          path: release/NightBrew-DEV-UNSIGNED-*.exe
          if-no-files-found: error
          retention-days: 7
