name: Build macOS development apps
on:
  push:
    branches: [main]
    paths-ignore: ["fieldops/**", ".github/workflows/fieldops.yml"]
  pull_request:
    paths-ignore: ["fieldops/**", ".github/workflows/fieldops.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run desktop:install
      - name: Install backend dependencies
        run: |
          python -m venv .venv
          if [ "${{ matrix.arch }}" = "x64" ]; then
            # cryptography has no Intel macOS wheel. Its source build must not
            # dynamically load Python's older, same-named OpenSSL in PyInstaller.
            export OPENSSL_DIR="$(brew --prefix openssl@3)"
            export OPENSSL_STATIC=1
            test -f "$OPENSSL_DIR/lib/libssl.a"
            test -f "$OPENSSL_DIR/lib/libcrypto.a"
          fi
          .venv/bin/python -m pip install -r backend/requirements-build.txt
      - run: .venv/bin/python -m pytest backend/tests -q --junitxml=pytest-macos.xml
      - name: Report backend test failures
        if: always()
        run: .venv/bin/python scripts/report-tests.py pytest-macos.xml
      - run: npm run test:desktop
      - run: npm run build
      - run: npm run test:electron
      - name: Build native macOS app and disk image
        run: |
          source .venv/bin/activate
          npm run package:mac:unsigned
      - name: Verify bundled backend and application startup
        run: |
          source .venv/bin/activate
          python scripts/verify-macos-package.py '${{ matrix.arch }}'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: NightBrew-macOS-${{ matrix.arch }}-DEV-UNSIGNED
          path: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
