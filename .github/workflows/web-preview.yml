name: Publish website interface preview
on:
  push:
    branches: [main]
    paths: ['src/WebPreview.tsx', 'src/web-main.tsx', 'src/web-preview.css', 'src/i18n.tsx', 'src/Icon.tsx', 'web-preview.html', 'vite.web.config.ts', 'playwright.web.config.ts', 'web-tests/**', '.github/workflows/web-preview.yml', 'package.json', 'package-lock.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-preview-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NIGHTBREW_CHROMIUM: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build standalone interface preview
        run: |
          node_modules/.bin/tsc --noEmit
          node_modules/.bin/vite build --config vite.web.config.ts
      - name: Test the actual browser interface and local CSV generation
        run: node_modules/.bin/playwright test --config playwright.web.config.ts
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: NightBrew-Web-Preview
          path: build/web-preview/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3, MIT
        with:
          path: build/web-preview/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable and configure the preview site
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5, MIT
        with:
          enablement: true
      - name: Publish only the static preview, never the desktop backend
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4, MIT
