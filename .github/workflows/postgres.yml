name: PostgreSQL authority integration
on:
  push:
    branches: [main]
    paths: ['billing_service/**', 'deploy/**', 'backend/tests/test_billing.py', 'backend/tests/test_gateway_admission.py', '.github/workflows/postgres.yml']
  pull_request:
    paths: ['billing_service/**', 'deploy/**', 'backend/tests/test_billing.py', 'backend/tests/test_gateway_admission.py', '.github/workflows/postgres.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      database:
        image: postgres:16.10-bookworm
        env:
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: nightbrew_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d nightbrew_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r deploy/requirements.txt
      - run: python -m pytest deploy/test_postgres_integration.py -q
        env:
          NIGHTBREW_POSTGRES_TEST_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/nightbrew_test_ci
