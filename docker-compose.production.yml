services:
  api:
    environment:
      NIGHTBREW_SERVER_ENV: production
    ports: !reset []
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  migrate:
    environment:
      NIGHTBREW_SERVER_ENV: production
      NIGHTBREW_MIGRATION_BACKUP_VERIFIED: ${NIGHTBREW_MIGRATION_BACKUP_VERIFIED:-NO}
  proxy:
    image: caddy:2.10.2-alpine
    ports: ['80:80','443:443']
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
